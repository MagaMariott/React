<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign routes</title>
    <script>
      (function () {
        try {
          var target = sessionStorage.getItem("signRoutesPath");
          if (!target) return;
          sessionStorage.removeItem("signRoutesPath");
          if (target.indexOf("/React/routes/") === 0) {
            history.replaceState(null, "", target);
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
