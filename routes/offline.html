<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172028" />
    <title>Offline · Sign routes</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: #172028;
        background: #f3f1ea;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        line-height: 1.45;
      }
      main {
        width: min(480px, 100%);
        padding: 24px 20px;
        border: 1px solid #ddd6c8;
        border-radius: 18px;
        background: #fffcf7;
      }
      .sign {
        width: 56px;
        height: 56px;
        margin: 6px 0 22px 10px;
        border: 6px solid #172028;
        background: #f2b705;
        transform: rotate(45deg);
      }
      p.eyebrow {
        margin: 0 0 6px;
        color: #0c5c5c;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 10px; font-size: 1.6rem; letter-spacing: -0.02em; }
      p { margin: 0 0 14px; color: #4c5961; }
      button {
        min-height: 48px;
        padding: 10px 18px;
        border: 1px solid #172028;
        border-radius: 999px;
        background: #172028;
        color: #fffdf8;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; }
      #status { min-height: 1.45em; margin: 14px 0 0; color: #172028; }
    </style>
  </head>
  <body>
    <main>
      <div class="sign" aria-hidden="true"></div>
      <p class="eyebrow">Offline</p>
      <h1>There is no connection</h1>
      <p>Sign routes could not open this page without the network. Pages and signs you opened before are still saved on this device.</p>
      <button type="button" id="retry">Retry connection</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      (function () {
        var button = document.getElementById("retry");
        var status = document.getElementById("status");

        function scope() {
          if (!("serviceWorker" in navigator)) return Promise.resolve(new URL("./", location.href).href);
          return navigator.serviceWorker
            .getRegistration()
            .then(function (registration) {
              return registration ? registration.scope : new URL("./", location.href).href;
            })
            .catch(function () {
              return new URL("./", location.href).href;
            });
        }

        function check() {
          button.disabled = true;
          status.textContent = "Checking the connection…";
          scope()
            .then(function (base) {
              return fetch(base + "api/ping.json?t=" + Date.now(), { cache: "no-store" });
            })
            .then(function (response) {
              if (!response.ok) throw new Error("No answer");
              status.textContent = "Back online. Loading the page…";
              location.reload();
            })
            .catch(function () {
              button.disabled = false;
              status.textContent = "Still offline. Checked at " + new Date().toLocaleTimeString() + ".";
            });
        }

        button.addEventListener("click", check);
        window.addEventListener("online", check);
      })();
    </script>
  </body>
</html>
